# 통합 테스트 전용 값. 실제 비밀값이 아니며(마스터키도 테스트용으로 새로 만든 무작위 값) 외부 서비스로 나가는 호출은 테스트에서 쓰지 않는다.
# DB는 아래 spring.datasource의 인메모리 H2를 쓰고, Redis 포트는 IntegrationTest가 내장 Redis 포트로 덮어쓴다.
REDIS_HOST: localhost
REDIS_PORT: 6379
JWT_SECRET: integration-test-jwt-secret-key-that-is-long-enough-for-hs384
ACCESS_EXPIRATION: 1800000
REFRESH_EXPIRATION: 1209600000
EMAIL: test@example.com
EMAIL_PASSWORD: test
CLIENT_ID: test
CLIENT_SECRET: test
KAKAO_CLIENT_ID: test
KAKAO_CLIENT_SECRET: test
NAVER_CLIENT_ID: test
NAVER_CLIENT_SECRET: test
COSMOS_NODE_URL: http://localhost:1
COSMOS_CHAIN_ID: test
COSMOS_CONTRACT_URL_SALT: test
SOLAPI_API_KEY: test
SOLAPI_API_SECRET_KEY: test
SOLAPI_SENDER_NUMBER: "01000000000"
MEMBER_KEY_MASTER_KEY: DBB9lNOFQzqIw1CX6dtDHONhqiFDmhiJfwQKmJbXBQY=
COOKIE_SECURE: false
COOKIE_SAME_SITE: Lax
COOKIE_DOMAIN: ""

spring:
  datasource:
    # PostgreSQL 호환 모드. 서버 코드가 직접 부르는 PostgreSQL 함수는 H2Functions로 대신한다.
    url: "jdbc:h2:mem:idta;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1;INIT=CREATE ALIAS IF NOT EXISTS pg_advisory_xact_lock FOR 'spring.springserver.support.H2Functions.pgAdvisoryXactLock'\\;CREATE ALIAS IF NOT EXISTS hashtext FOR 'spring.springserver.support.H2Functions.hashtext'"
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

management:
  health:
    mail:
      enabled: false
