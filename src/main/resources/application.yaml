server:
  forward-headers-strategy: framework

  # JWT 기반이라 세션을 쓰지 않지만, 만에 하나 만들어지더라도
  # JSESSIONID가 스크립트에 노출되지 않도록 잠가둔다.
  servlet:
    session:
      cookie:
        http-only: true
        secure: ${COOKIE_SECURE:true}
        same-site: ${COOKIE_SAME_SITE:None}

spring:
  config:
    import: optional:file:.env[.properties]

  application:
    name: springServer

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      leak-detection-threshold: 20000

  jpa:
    # SSE처럼 오래 열려 있는 요청이 EntityManager와 JDBC 커넥션을 요청 종료까지
    # 붙잡고 있어 커넥션 풀이 고갈되므로 OSIV를 끈다.
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  jwt:
    secret: ${JWT_SECRET}
    accessTokenExpiration: ${ACCESS_EXPIRATION}
    refreshTokenExpiration: ${REFRESH_EXPIRATION}

  mail:
    host: smtp.gmail.com
    username: ${EMAIL}
    password: ${EMAIL_PASSWORD}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${CLIENT_ID}
            client-secret: ${CLIENT_SECRET}
            scope:
              - profile
              - email
          kakao:
            client-id: ${KAKAO_CLIENT_ID}
            client-secret: ${KAKAO_CLIENT_SECRET}
            redirect-uri: "{baseUrl}/login/oauth2/code/kakao"
            authorization-grant-type: authorization_code
            client-authentication-method: client_secret_post
            scope:
              - profile_nickname
              - account_email
            client-name: Kakao
          naver:
            client-id: ${NAVER_CLIENT_ID}
            client-secret: ${NAVER_CLIENT_SECRET}
            redirect-uri: "{baseUrl}/login/oauth2/code/naver"
            authorization-grant-type: authorization_code
            client-authentication-method: client_secret_post
            scope:
              - name
              - email
            client-name: Naver
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id
          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            user-name-attribute: response

  mvc:
    async:
      # SSE 연결 수명은 SseEmitter 타임아웃으로 관리한다. (-1: MVC 레벨 타임아웃 비활성화)
      request-timeout: -1

  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 30MB

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true # 배포할 때 false로 변경
  swagger-ui:
    path: /swagger-ui.html
    display-request-duration: true
    enabled: true # 배포할 때 false로 변경


# Prometheus가 /actuator/prometheus를 스크레이프해 메트릭을 가져간다.
# 접근 제어는 SecurityConfig의 actuatorFilterChain이 담당한다.
management:
  endpoints:
    web:
      exposure:
        # health와 prometheus만 노출한다.
        # env/heapdump/threaddump는 환경변수와 자격증명을 그대로 흘리므로
        # 절대 추가하지 않는다.
        include: health,prometheus
  endpoint:
    health:
      show-details: never
  prometheus:
    metrics:
      export:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    web:
      server:
        # path variable이 uri 라벨에 그대로 박히면 요청마다 새 시계열이 생겨
        # Prometheus 메모리가 터진다. 상한을 안전핀으로 둔다.
        max-uri-tags: 100

app:
  upload:
    file-dir: ./files
  oauth2:
    redirect-uri: ${OAUTH2_REDIRECT_URI:http://localhost:3000/oauth/success}
    failure-redirect-uri: ${OAUTH2_FAILURE_REDIRECT_URI:http://localhost:3000/oauth/fail}
  # 프론트와 서버가 서브도메인으로 갈려 있어 크로스 사이트로 쿠키가 오간다.
  # 상위 도메인 지정과 SameSite=None, Secure는 셋이 함께여야 refreshToken이 실린다.
  # 로컬(http://localhost)에서는 이 조합으로 쿠키가 심기지 않으므로
  # .env에 COOKIE_DOMAIN=, COOKIE_SAME_SITE=Lax, COOKIE_SECURE=false로 덮어쓴다.
  # 쿠키 인증(allow-credentials)을 쓰므로 오리진을 열어두면 안 된다.
  # 임의 사이트에서 로그인된 사용자의 쿠키로 API를 호출할 수 있게 된다.
  # 콤마로 구분하며, 서브도메인은 와일드카드 패턴을 쓸 수 있다.
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,https://idta.store,https://*.idta.store}
  cookie:
    same-site: ${COOKIE_SAME_SITE:None}
    secure: ${COOKIE_SECURE:true}
    domain: ${COOKIE_DOMAIN:.idta.store}

toss-payments:
  secret-key: ${TOSS_PAYMENTS_SECRET_KEY:}
  base-url: https://api.tosspayments.com
  api-version: 2024-06-01

cosmos:
  submitter-private-key: ${COSMOS_SUBMITTER_PRIVATE_KEY}
  node-url: ${COSMOS_NODE_URL}
  chain-id: ${COSMOS_CHAIN_ID}

solapi:
  api-key: ${SOLAPI_API_KEY}
  api-secret-key: ${SOLAPI_API_SECRET_KEY}
  sender-number: ${SOLAPI_SENDER_NUMBER}