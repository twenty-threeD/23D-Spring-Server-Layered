name: CI/CD

on:
  push:
    branches: [ main, develop ]

permissions:
  contents: read
  packages: write

# 같은 브랜치 배포는 한 번에 하나만 실행한다. 진행 중인 배포를 끊으면 EC2에 반쯤 전환된 상태가
# 남을 수 있으므로 취소하지 않고, 뒤에 온 배포는 앞 배포가 끝날 때까지 기다린다
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Java 21 설정
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: 배포 Secret 검증
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_KEY: ${{ secrets.EC2_KEY }}
          MEMBER_KEY_MASTER_KEY: ${{ secrets.MEMBER_KEY_MASTER_KEY }}
        run: |
          set -e

          for key in EC2_HOST EC2_USER EC2_KEY MEMBER_KEY_MASTER_KEY; do
            if [ -z "${!key}" ]; then
              echo "필수 Secret이 설정되지 않았습니다: $key"
              exit 1
            fi
          done

      # 캐시는 아래 두 actions/cache 단계가 직접 관리한다.
      # setup-gradle 캐시는 키에 커밋 SHA가 들어가 매 실행마다 새로 저장(약 10초)하므로 끈다
      - name: Gradle 설치
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'
          cache-disabled: true

      # 의존성은 빌드 스크립트가 바뀔 때만 키가 바뀌므로, 키가 그대로면 복원만 하고 저장은 건너뛴다
      - name: Gradle 의존성 캐시
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-deps-${{ runner.os }}-${{ hashFiles('build.gradle.kts', 'settings.gradle.kts') }}
          restore-keys: |
            gradle-deps-${{ runner.os }}-

      # 직전 빌드의 컴파일 결과와 Gradle 실행 기록을 복원해 Kotlin이 바뀐 파일만 다시 컴파일하게 한다.
      # 복원한 상태가 맞지 않으면 Kotlin이 전체 컴파일로 되돌아가므로 결과물이 틀어지지 않는다
      - name: Kotlin 증분 컴파일 상태 캐시
        uses: actions/cache@v4
        with:
          path: |
            .gradle
            build/classes
            build/kotlin
            build/resources
          key: kotlin-ic-${{ runner.os }}-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            kotlin-ic-${{ runner.os }}-${{ github.ref_name }}-

      - name: Docker 이미지 메타데이터 설정
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          echo "IMAGE_NAME=ghcr.io/$OWNER/spring-server" >> "$GITHUB_ENV"

      - name: GHCR 로그인
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # 테스트가 통과해야 jib가 실행된다. Gradle을 한 번만 띄워 데몬 기동·설정 시간을 아낀다.
      # Jib이 GHCR 로그인 정보(~/.docker/config.json)로 레이어를 나눠 바로 push 한다
      - name: 테스트 및 Jib 이미지 빌드 · GHCR Push
        run: |
          gradle test jib \
            -Djib.to.image="$IMAGE_NAME:${{ github.sha }}" \
            -Djib.to.tags=latest

      # v1.1부터 composite 방식이라 매 실행마다 액션용 Docker 이미지를 빌드하지 않는다
      - name: EC2에서 Blue-Green 컨테이너 전환
        uses: appleboy/ssh-action@v1.2.5
        env:
          MEMBER_KEY_MASTER_KEY: ${{ secrets.MEMBER_KEY_MASTER_KEY }}
          # 기존 평문 개인키 일괄 암호화 스위치. 이 코드가 한 번 배포된 뒤 Actions Variable을 true로 바꾸고 재배포한다
          MEMBER_KEY_ENCRYPT_PLAINTEXT: ${{ vars.MEMBER_KEY_ENCRYPT_PLAINTEXT == 'true' && 'true' || 'false' }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          envs: MEMBER_KEY_MASTER_KEY,MEMBER_KEY_ENCRYPT_PLAINTEXT
          script: |
            set -e

            APP_DIR="/opt/spring-server"
            NETWORK_NAME="spring-server-network"
            PROXY_NAME="spring-server-proxy"
            OWNER="${{ github.repository_owner }}"
            OWNER="$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')"
            IMAGE_NAME="ghcr.io/$OWNER/spring-server:${{ github.sha }}"
            # API 문서는 운영에서 꺼지므로 health check로 쓸 수 없다.
            # actuator의 health는 인증 없이 열려 있고 DB/Redis 연결까지 확인한다.
            HEALTH_PATH="/actuator/health"

            mkdir -p "$APP_DIR/files" "$APP_DIR/nginx/conf.d"
            echo "${{ github.token }}" | sudo docker login ghcr.io -u "${{ github.actor }}" --password-stdin

            # pull 전에 dangling 이미지를 먼저 비운다(디스크가 이미 가득 차면 pull 자체가 실패하므로)
            sudo docker image prune -f || true

            sudo docker pull "$IMAGE_NAME"

            if [ ! -f "$APP_DIR/.env" ]; then
              echo "필수 환경 변수 파일이 없습니다: $APP_DIR/.env"
              exit 1
            fi

            for key in DB_URL DB_USERNAME DB_PASSWORD JWT_SECRET ACCESS_EXPIRATION REFRESH_EXPIRATION EMAIL EMAIL_PASSWORD REDIS_HOST REDIS_PORT CLIENT_ID CLIENT_SECRET KAKAO_CLIENT_ID KAKAO_CLIENT_SECRET NAVER_CLIENT_ID NAVER_CLIENT_SECRET SOLAPI_API_KEY SOLAPI_API_SECRET_KEY SOLAPI_SENDER_NUMBER; do
              if ! grep -Eq "^[[:space:]]*$key=" "$APP_DIR/.env"; then
                echo "필수 환경 변수가 .env에 없습니다: $key"
                exit 1
              fi
            done

            # 회원 개인키 마스터키는 .env와 분리된 파일로 두어 .env가 새어 나가도 함께 노출되지 않게 한다
            SECRET_DIR="$APP_DIR/secrets"
            MEMBER_KEY_ENV_FILE="$SECRET_DIR/member-key.env"

            if [ -z "$MEMBER_KEY_MASTER_KEY" ]; then
              echo "필수 Secret이 전달되지 않았습니다: MEMBER_KEY_MASTER_KEY"
              exit 1
            fi

            mkdir -p "$SECRET_DIR"
            chmod 700 "$SECRET_DIR"
            (umask 077 && printf 'MEMBER_KEY_MASTER_KEY=%s\nMEMBER_KEY_ENCRYPT_PLAINTEXT=%s\n' "$MEMBER_KEY_MASTER_KEY" "$MEMBER_KEY_ENCRYPT_PLAINTEXT" > "$MEMBER_KEY_ENV_FILE")

            sudo docker network create "$NETWORK_NAME" 2>/dev/null || true

            NGINX_CONF="$APP_DIR/nginx/conf.d/default.conf"
            ACTIVE_COLOR="none"

            if [ -f "$NGINX_CONF" ]; then
              if grep -q "server spring-server-blue:8080;" "$NGINX_CONF"; then
                ACTIVE_COLOR="blue"
              elif grep -q "server spring-server-green:8080;" "$NGINX_CONF"; then
                ACTIVE_COLOR="green"
              fi
            fi

            if [ "$ACTIVE_COLOR" = "blue" ]; then
              NEW_COLOR="green"
              NEW_PORT="8082"
            else
              NEW_COLOR="blue"
              NEW_PORT="8081"
            fi

            NEW_CONTAINER="spring-server-$NEW_COLOR"

            sudo docker rm -f "$NEW_CONTAINER" 2>/dev/null || true

            sudo docker run -d \
              --name "$NEW_CONTAINER" \
              --network "$NETWORK_NAME" \
              --restart unless-stopped \
              -p "$NEW_PORT:8080" \
              --env-file "$APP_DIR/.env" \
              --env-file "$MEMBER_KEY_ENV_FILE" \
              -v "$APP_DIR/files:/app/files" \
              "$IMAGE_NAME"

            # 1초 간격으로 확인해 기동 직후 바로 전환한다(최대 대기 90초는 그대로)
            for i in $(seq 1 90); do
              if curl -fsS "http://localhost:$NEW_PORT$HEALTH_PATH" >/dev/null; then
                break
              fi

              if [ "$i" -eq 90 ]; then
                sudo docker logs "$NEW_CONTAINER" --tail 100
                sudo docker rm -f "$NEW_CONTAINER"
                echo "새 컨테이너 health check 실패"
                exit 1
              fi

              sleep 1
            done

            sudo tee "$APP_DIR/nginx/conf.d/default.conf" > /dev/null <<EOF
            # 상위 프록시(TLS 종료 지점)가 보낸 값이 있으면 유지하고, 없을 때만 이 nginx의 값을 사용한다
            map \$http_x_forwarded_proto \$forwarded_proto {
                default \$http_x_forwarded_proto;
                ""      \$scheme;
            }

            map \$http_x_forwarded_host \$forwarded_host {
                default \$http_x_forwarded_host;
                ""      \$host;
            }

            map \$http_upgrade \$connection_upgrade {
                default upgrade;
                ""      close;
            }

            upstream spring_server {
                server $NEW_CONTAINER:8080;
            }

            server {
                listen 80;

                # 업로드 최대 크기(Spring multipart max-file-size 25MB에 맞춘다)
                client_max_body_size 30M;

                location /actuator {
                    allow 127.0.0.0/8;
                    allow 172.16.0.0/12;
                    deny all;

                    proxy_pass http://spring_server;
                    proxy_set_header Host \$forwarded_host;
                    proxy_set_header X-Forwarded-For \$remote_addr;
                    proxy_set_header X-Forwarded-Proto \$forwarded_proto;
                }

                location / {
                    proxy_pass http://spring_server;
                    proxy_http_version 1.1;
                    proxy_set_header Upgrade \$http_upgrade;
                    proxy_set_header Connection \$connection_upgrade;

                    proxy_read_timeout 3600s;
                    proxy_send_timeout 3600s;

                    proxy_set_header Host \$forwarded_host;
                    proxy_set_header X-Real-IP \$remote_addr;
                    proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;
                    proxy_set_header X-Forwarded-Proto \$forwarded_proto;
                    proxy_set_header X-Forwarded-Host \$forwarded_host;
                }
            }
            EOF

            sudo docker rm -f spring-server 2>/dev/null || true

            if sudo docker ps --format '{{.Names}}' | grep -q "^$PROXY_NAME$"; then
              sudo docker exec "$PROXY_NAME" nginx -t
              sudo docker exec "$PROXY_NAME" nginx -s reload
            else
              sudo docker rm -f "$PROXY_NAME" 2>/dev/null || true
              sudo docker run -d \
                --name "$PROXY_NAME" \
                --network "$NETWORK_NAME" \
                --restart unless-stopped \
                -p 8080:80 \
                -v "$APP_DIR/nginx/conf.d:/etc/nginx/conf.d:ro" \
                nginx:alpine
            fi

            # 새로 띄운 색을 뺀 나머지 색은 전부 제거한다
            # (nginx conf가 없거나 패턴이 안 맞아 ACTIVE_COLOR를 못 읽은 경우에도 좀비 컨테이너가 남지 않도록)
            for color in blue green; do
              if [ "$color" != "$NEW_COLOR" ]; then
                sudo docker rm -f "spring-server-$color" 2>/dev/null || true
              fi
            done

            # 지금 서비스 중인 이미지만 남기고 이전 배포 이미지를 지운다
            # (SHA 태그가 붙어 있어 dangling이 아니므로 prune -f로는 정리되지 않는다)
            sudo docker images "ghcr.io/$OWNER/spring-server" --format '{{.Repository}}:{{.Tag}}' \
              | grep -v "^$IMAGE_NAME\$" \
              | xargs -r sudo docker rmi -f 2>/dev/null || true

            sudo docker image prune -f
            echo "Blue-green Docker 배포 완료! active=$NEW_COLOR"

      - name: 오래된 GHCR 이미지 버전 삭제
        uses: actions/delete-package-versions@v5
        continue-on-error: true
        with:
          package-name: spring-server
          package-type: container
          min-versions-to-keep: 10
          delete-only-untagged-versions: false