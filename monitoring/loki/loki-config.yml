# 단일 바이너리 모드 + 파일시스템 스토리지.
# 2 GiB 서버이므로 캐시를 최소로 잡고 보존기간을 7일로 제한한다.
auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: warn                    # info 로 두면 로그가 로그를 부른다

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  retention_period: 168h             # 7일
  reject_old_samples: true
  reject_old_samples_max_age: 168h
  ingestion_rate_mb: 4
  ingestion_burst_size_mb: 8
  max_streams_per_user: 5000         # 카디널리티 폭발 방지 안전핀
  max_entries_limit_per_query: 5000
  volume_enabled: true

compactor:
  working_directory: /loki/compactor
  retention_enabled: true            # 이게 있어야 7일 지난 청크가 실제로 지워진다
  delete_request_store: filesystem
  compaction_interval: 10m

# 쿼리 결과 캐시를 끈다. 메모리를 아끼는 대신 반복 쿼리가 조금 느려진다.
query_range:
  cache_results: false

analytics:
  reporting_enabled: false
