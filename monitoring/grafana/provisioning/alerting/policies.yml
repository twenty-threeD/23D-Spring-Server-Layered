# 알림 라우팅 정책.
# critical 은 즉시+자주, warning 은 느슨하게 반복한다.
apiVersion: 1

policies:
  - orgId: 1
    receiver: default-notifier
    group_by: [alertname, severity]
    group_wait: 30s          # 첫 알림까지 대기 (연관 알림을 묶기 위함)
    group_interval: 5m       # 같은 그룹에 새 알림이 추가될 때 간격
    repeat_interval: 4h      # 해결되지 않은 알림 재통지 간격
    routes:
      - receiver: default-notifier
        object_matchers:
          - ['severity', '=', 'critical']
        group_wait: 10s
        repeat_interval: 1h
