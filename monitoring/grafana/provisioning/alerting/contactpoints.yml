# 알림 수신처 (Discord).
# ${DISCORD_WEBHOOK_URL} 는 .env 의 값으로 치환된다.
#
# 웹훅 만들기: Discord 서버 설정 → 연동 → 웹후크 → 새 웹후크 →
#              채널 지정 후 "웹후크 URL 복사"
#
# 주의: URL 이 틀려도 Grafana 는 조용히 실패한다.
# 반드시 UI(Alerting → Contact points → Test)에서 테스트 발송할 것.
apiVersion: 1

contactPoints:
  - orgId: 1
    name: default-notifier
    receivers:
      - uid: discord-primary
        type: discord
        settings:
          url: ${DISCORD_WEBHOOK_URL}
          title: '[{{ .Status | toUpper }}] {{ .CommonLabels.alertname }}'
          message: >-
            {{ range .Alerts }}**{{ .Annotations.summary }}**
            {{ .Annotations.description }}
            {{ end }}
          use_discord_username: false
        disableResolveMessage: false
