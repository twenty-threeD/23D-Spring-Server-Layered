# 스크레이프 간격은 메모리와 직결된다.
# 활성 시계열 × (보존 블록) 이 메모리를 정하므로, 15s 보다 짧게 가지 않는다.
global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s
  external_labels:
    server: itda-backend
    instance_type: t3.small

scrape_configs:
  # ── Prometheus 자기 자신 ────────────────────────────────────────────
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  # ── 호스트 지표: CPU / RAM / 디스크 / 네트워크 ──────────────────────
  # Grafana 대시보드 ID 1860 (Node Exporter Full) 이 이 job 을 그대로 쓴다.
  - job_name: node
    static_configs:
      - targets: ['node-exporter:9100']
        labels:
          nodename: ip-172-31-13-141

  # ── Spring Boot Actuator ────────────────────────────────────────────
  # 전제조건: 백엔드에 spring-boot-starter-actuator +
  #           micrometer-registry-prometheus 추가 후 재배포.
  #           절차는 ACTUATOR.md 참고.
  #
  # 이 앱은 Spring Security 가 모든 요청에 401 을 반환하는 상태다.
  # 아래 둘 중 하나를 선택해야 스크레이프가 성공한다.
  #   (a) SecurityConfig 에서 /actuator/prometheus 를 permitAll  → basic_auth 불필요
  #   (b) 스크레이프 전용 계정을 만들고 아래 basic_auth 주석 해제
  - job_name: spring-boot
    metrics_path: /actuator/prometheus
    scheme: http
    # basic_auth:
    #   username: '${PROM_SCRAPE_USER}'
    #   password: '${PROM_SCRAPE_PASSWORD}'
    static_configs:
      - targets: ['host.docker.internal:8080']
        labels:
          application: itda-backend
          port: '8080'

  # 8082 컨테이너도 Spring Boot 라면 아래 주석을 해제한다.
  # - job_name: spring-boot-8082
  #   metrics_path: /actuator/prometheus
  #   static_configs:
  #     - targets: ['host.docker.internal:8082']
  #       labels:
  #         application: itda-backend-8082
  #         port: '8082'
